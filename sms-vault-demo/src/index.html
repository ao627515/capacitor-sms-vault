<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>SmsVaultDemo</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="SmsVaultDemo — testeur complet pour capacitor-sms-vault" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0f1117" />

    <link rel="stylesheet" href="./css/app.css" />
  </head>

  <body>

    <!-- HEADER -->
    <header class="app-header">
      <span class="logo">📱</span>
      <h1>SmsVaultDemo</h1>
      <span class="version">v1.0.0</span>
    </header>

    <!-- CONTENT (Populated dynamically by JS Modules) -->
    <main class="app-content">
      <section id="tab-permissions" class="tab-panel active"></section>
      <section id="tab-smslist" class="tab-panel"></section>
      <section id="tab-live" class="tab-panel"></section>
      <section id="tab-otp" class="tab-panel"></section>
      <section id="tab-send" class="tab-panel"></section>
      <section id="tab-logs" class="tab-panel"></section>
    </main>

    <!-- TAB BAR -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="permissions">
        <span class="tab-icon">🔐</span>
        <span>Permissions</span>
      </button>
      <button class="tab-btn" data-tab="smslist">
        <span class="tab-icon">📬</span>
        <span>SMS List</span>
      </button>
      <button class="tab-btn" data-tab="live">
        <span class="tab-icon">📡</span>
        <span>Live</span>
      </button>
      <button class="tab-btn" data-tab="otp">
        <span class="tab-icon">🔑</span>
        <span>OTP</span>
      </button>
      <button class="tab-btn" data-tab="send">
        <span class="tab-icon">✉️</span>
        <span>Envoyer</span>
      </button>
      <button class="tab-btn" data-tab="logs">
        <span class="tab-icon">📋</span>
        <span>Logs</span>
      </button>
    </nav>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
